[project]
name = "meeting-room-backend"
version = "0.1.0"
description = "FastAPI backend for the local meeting-room booking system."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
